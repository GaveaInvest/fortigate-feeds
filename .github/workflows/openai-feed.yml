name: Update OpenAI feeds
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build feed
        run: |
          set -euo pipefail
          curl -fsS https://openai.com/chatgpt-voice.json -o /tmp/src.json
          jq -r '.prefixes[] | (.ipv4Prefix // .ipv6Prefix // empty)' /tmp/src.json \
            | grep -E '^[0-9a-fA-F:.]+/[0-9]{1,3}$' \
            | sort -u > /tmp/feed.txt
          n=$(wc -l < /tmp/feed.txt)
          echo "Entries: $n"
          if [ "$n" -lt 1 ] || [ "$n" -gt 2000 ]; then
            echo "Unexpected entry count: $n"; exit 1
          fi
          mkdir -p feeds
          mv /tmp/feed.txt feeds/chatgpt-voice.txt

      - name: Weekly keepalive
        run: |
          # segunda-feira, 06h UTC
          if [ "$(date -u +%u%H)" = "106" ]; then
            date -u +%FT%TZ > feeds/last-check.txt
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/
          git diff --cached --quiet || git commit -m "Update feeds"
          git push
